<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tariq Sneakers Store</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
header{background:#102b54;color:white;padding:24px 15px;text-align:center}
header h1{margin:0 0 8px}
header p{margin:0}
.controls{padding:15px;max-width:1100px;margin:auto}
input,select,button{padding:11px;border-radius:7px;border:1px solid #ccd4df;font-size:15px}
#search{width:100%;margin-bottom:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
button{cursor:pointer}
.filters button{background:white;color:#102b54}
.filters button.active,.buy{background:#1267d5;color:white;border:0}
h2{text-align:center}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px;padding:15px;max-width:1100px;margin:auto}
.card{background:white;border-radius:12px;padding:10px;box-shadow:0 2px 8px #0001}
.card img{width:100%;height:155px;object-fit:cover;border-radius:8px}
.card h3{font-size:16px;margin:10px 0 6px}
.price{color:#1267d5;font-weight:bold}
.card select{width:100%;margin:7px 0}
.card button{width:100%}
.cart{background:white;padding:18px;margin:20px auto;max-width:900px;border-radius:12px}
.cart-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee}
.cart-row button{padding:5px 10px}
.checkout{background:#168447;color:white;border:0;width:100%;margin-top:12px}
footer{text-align:center;padding:20px;background:#102b54;color:white}
</style>
</head>
<body>
<header>
<h1>👟 Tariq Sneakers Store</h1>
<p>Step Out in Style • Find Your Perfect Pair</p>
</header>

<section class="controls">
<input id="search" placeholder="Search shoes..." oninput="render()">
<div class="filters" id="filters"></div>
</section>

<h2>Our Sneakers Collection</h2>
<main class="products" id="products"></main>

<section class="cart">
<h2>🛒 Your Shopping Cart</h2>
<div id="cart"></div>
<h3 id="total">Total: KSh 0</h3>
<button class="checkout" onclick="checkout()">Order via WhatsApp</button>
</section>

<footer>© 2026 Tariq Sneakers Store</footer>

<script>
const categories = [
"All Shoes","Men's Sneakers","Ladies' Sneakers",
"Kids' Sneakers","Sports & Running","High-Top Sneakers",
"Casual & Fashion"
];

const shoes = [
{id:1,name:"Classic Men's Sneakers",cat:"Men's Sneakers",price:2500,img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"},
{id:2,name:"Street Style Sneakers",cat:"Men's Sneakers",price:3000,img:"https://images.unsplash.com/photo-1495555961986-6d4c1ecb7be3?w=500"},
{id:3,name:"White Casual Sneakers",cat:"Ladies' Sneakers",price:2800,img:"https://images.unsplash.com/photo-1549298916-b41d501d3772?w=500"},
{id:4,name:"Fashion Sneakers",cat:"Ladies' Sneakers",price:3200,img:"https://images.unsplash.com/photo-1552346154-21d32810aba3?w=500"},
{id:5,name:"Kids' Everyday Shoes",cat:"Kids' Sneakers",price:1800,img:"https://images.unsplash.com/photo-1514989940723-e8e51635b782?w=500"},
{id:6,name:"Kids' Sport Sneakers",cat:"Kids' Sneakers",price:2000,img:"https://images.unsplash.com/photo-1514989940723-e8e51635b782?w=500"},
{id:7,name:"Running Trainers",cat:"Sports & Running",price:3500,img:"https://images.unsplash.com/photo-1460353581641-37baddab0fa2?w=500"},
{id:8,name:"Lightweight Sports Shoes",cat:"Sports & Running",price:3000,img:"https://images.unsplash.com/photo-1539185441755-769473a23570?w=500"},
{id:9,name:"High-Top Street Sneakers",cat:"High-Top Sneakers",price:4000,img:"https://images.unsplash.com/photo-1552346154-21d32810aba3?w=500"},
{id:10,name:"Classic High-Tops",cat:"High-Top Sneakers",price:3800,img:"https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?w=500"},
{id:11,name:"Retro Casual Sneakers",cat:"Casual & Fashion",price:3200,img:"https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?w=500"},
{id:12,name:"Chunky Fashion Sneakers",cat:"Casual & Fashion",price:3600,img:"https://images.unsplash.com/photo-1552346154-21d32810aba3?w=500"}
];

let selectedCategory = "All Shoes";
let cart = [];

function money(n){
 return "KSh " + n.toLocaleString("en-KE");
}

function makeFilters(){
 document.getElementById("filters").innerHTML = categories.map(c =>
 `<button class="${c===selectedCategory?'active':''}"
 onclick="selectedCategory=${JSON.stringify(c)};makeFilters();render()">${c}</button>`
 ).join("");
}

function render(){
 const query = document.getElementById("search").value.toLowerCase();
 const list = shoes.filter(s =>
 (selectedCategory==="All Shoes"||s.cat===selectedCategory) &&
 (s.name.toLowerCase().includes(query)||s.cat.toLowerCase().includes(query))
 );
 document.getElementById("products").innerHTML = list.map(s=>`
 <article class="card">
 <img src="${s.img}" alt="${s.name}" loading="lazy">
 <h3>${s.name}</h3>
 <div>${s.cat}</div>
 <p class="price">${money(s.price)}</p>
 <label>Size:
 <select id="size-${s.id}">
 ${Array.from({length:12},(_,i)=>`<option>${i+35}</option>`).join("")}
 </select></label>
 <button class="buy" onclick="add(${s.id})">Add to Cart</button>
 </article>`).join("") || "<p>No matching shoes found.</p>";
 drawCart();
}

function add(id){
 const s=shoes.find(x=>x.id===id);
 const size=document.getElementById("size-"+id).value;
 const item=cart.find(x=>x.id===id&&x.size===size);
 if(item)item.qty++;
 else cart.push({...s,size,qty:1});
 drawCart();
}

function changeQty(id,size,delta){
 const item=cart.find(x=>x.id===id&&x.size===size);
 if(!item)return;
 item.qty+=delta;
 cart=cart.filter(x=>x.qty>0);
 drawCart();
}

function drawCart(){
 document.getElementById("cart").innerHTML=cart.map(x=>`
 <div class="cart-row">
 <div>${x.name}<br>Size ${x.size} • ${money(x.price)}
 <br>Qty: ${x.qty} = ${money(x.price*x.qty)}</div>
 <div>
 <button onclick="changeQty(${x.id},'${x.size}',-1)">−</button>
 <button onclick="changeQty(${x.id},'${x.size}',1)">+</button>
 </div></div>`).join("") || "<p>Your cart is empty.</p>";
 const total=cart.reduce((sum,x)=>sum+x.price*x.qty,0);
 document.getElementById("total").textContent="Total: "+money(total);
}

function checkout(){
 if(!cart.length){alert("Please add shoes to your cart first.");return;}
 const total=cart.reduce((sum,x)=>sum+x.price*x.qty,0);
 const lines=cart.map(x=>`${x.name}, Size ${x.size}, Qty ${x.qty}: ${money(x.price*x.qty)}`);
 const message="Hello Tariq Sneakers Store! I would like to order:\n"+
 lines.join("\n")+"\nTotal: "+money(total);
 window.open("https://wa.me/25415464542?text="+encodeURIComponent(message),"_blank");
}

makeFilters();
render();
</script>
</body>
</html>
